model_config: ../model/dgem_memory.yaml

data:
  task_type       : 'video'
  name            : video_propagation
  num_ch          : 3
  num_class       : 10
  notes           : 'Use sparse labels for support and supervised query frames.'
  root            : data/videos
  train           : data/sample_dataset/sample_video.csv
  test            : data/sample_dataset/sample_video.csv

  mask_col        : mask 


  ignore_index    : 255

  # Grayscale palette -> class id
  code_to_class:
    0:  0    # background
    1:  1    # tool_clasper
    2:  2    # tool_wrist
    3:  3    # tool_shaft
    4:  4    # suturing_needle
    5:  5    # thread
    6:  6    # suction_tool
    7:  7    # needle_holder
    8:  8    # clamps
    9:  9    # catheter
    255: 255 # ignore (optional, if you use ignore masks)

  label_json      : 

# EXPERIMENT SETUP

experiment:
  name          : ''
  notes         : 'Set num_class and code_to_class for your labels.'
  seed          : 417
  debug         : False
  SUFFX         : 'video_propagation'

train:
  save_every: 5
  use_raw_logits : True
  aux_raw_w     : 0.2

  debug         : [False, False]

  t_query       : 10           # number of training frames to sample per video
  s_support     : 5           # number of support frames
  allowed_max_items: 500
  allowed_seed: 1337
  allowed_kwin: 2
  allowed_strict_consecutive: true
  jitter        : 0            # jitter around frames 
  epoch_salt    : 0

  use_stream    : True
  rollout_len   : 80        # e.g. 80 frames processed per clip
  rollout_mode  : "full"    # window | allowed | full
  loss_on_query_indices_only: True
  resize_h      : 480
  resize_w      : 854
  eval_only     : False
  bs            : 1
  num_workers   : 4
  model_path    : outputs/video_propagation

  epochs        : 20


  cs            : [256, 256] # [256, 256]
  wd            : 0.0001
  lr_enc        : 0.00001
  lr_dec        : 0.0002
  dice_weight   : 0.1
  dice_inc_bg   : False
  amp           : True

  model         : dv3_vits16plus      # dv3_vits16plus, _vitb16, _vitl16,
                                      # sam2.1_small, _tiny, _large,
                                      # xmem
  # DV3 SEG
  pt_encoder    : True
  ft_encoder    : True
  unfreeze_epoch   : 0

  # SAM2
  sam2_enhanced: True
  sam2_topk_per_class: 3
  sam2_reprompt_every: 10
  sam2_cc_min_area: 25
  sam2_reprompt_cc_min_area: 50
  sam2_reprompt_prob_thresh: 0.35


val:
  use_stream          : True, 
  rollout_len         : 275
  val_t_query         : -1
  val_every           : 1
  rollout_mode        : window
  rollout_start_idx   : 1

  wandb_vis           : False
  wandb_vis_every     : 50
  wandb_vis_max       : 2
  wandb_vis_frames    : 3

  save_preds_every: 10       # dump preds+GT every N epochs
  save_preds_max_batches: 2  # limit number of videos per epoch
  save_preds_max_frames: 50  # limit frames per video
