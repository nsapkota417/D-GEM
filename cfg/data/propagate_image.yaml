model_config: ../model/no_memory.yaml

inf:
  weights: path/to/checkpoint.pth
  video: path/to/input_video.mp4
  results_dir: outputs/image_propagation
  run_name: image_propagation

  gpu: 0
  batch_size: 12
  num_workers: 4

  overwrite: false

  save_frames: true
  save_masks: true
  save_video: true

  # # Optional overrides. Otherwise train.resize_h/w are used.
  # resize_h: 896
  # resize_w: 1120


data:
  task_type       : 'image'
  name            : image_propagation
  num_ch          : 3           
  num_class       : 2
  notes           : 'Set num_class and code_to_class for your labels.'
  train           : data/sample_dataset/sample_video.csv
  test            : data/sample_dataset/sample_video.csv
  train_vids      : []
  test_vids       : []
  include_indices : 
  use_rep_only    : False
  modality        :     # set false always if not using multi-modality experiments
  ignore_index    : 255
  code_to_class:
    0:  0    # background
    255:  1    # tool_clasper
  img_col: img
  mask_col: mask

experiment:
  name          : ''
  notes         : ''
  seed          : 417
  debug         : False
  SUFFX         : 'image_propagation'
  project_path  : outputs/image_propagation



train:
  save_every: 5

  sample_in_video: False
  t_query       : 600          # number of training frames to sample per video

  resize_h      : 896
  resize_w      : 1120

  bs            : 8
  epochs        : 60

  # DV3 SEG
  pt_encoder    : True
  ft_encoder    : True
  unfreeze_epoch   : 3

  use_raw_logits : False
  aux_raw_w     : 0.2
  debug         : [False, False]

  s_support     : 1           # number of support frames
  allowed_max_items: 500
  allowed_seed: 1337
  allowed_kwin: 2
  allowed_strict_consecutive: true
  jitter        : 0            # jitter around frames 
  epoch_salt    : 0

  use_stream    : False
  rollout_len   : 40        # e.g. 80 frames processed per clip
  rollout_mode  : window # window | allowed | full
  loss_on_query_indices_only: True

  num_workers   : 4



  cs            : [256, 256] # [256, 256]
  wd            : 0.0001
  lr_enc        : 0.00001
  lr_dec        : 0.0002
  dice_weight   : 0.1
  dice_inc_bg   : False
  amp           : False

  model         : dv3_vits16plus    # dv3_vits16plus, _vitb16, _vitl16,
                                      # sam2.1_small, _tiny, _large,
                                      # xmem, stm
                                      # raft

  ckpt_to_use : path/to/checkpoint.pth

  # SAM2
  sam2_enhanced: True
  sam2_topk_per_class: 3
  sam2_reprompt_every: 10
  sam2_cc_min_area: 25
  sam2_reprompt_cc_min_area: 50
  sam2_reprompt_prob_thresh: 0.35


val:
  eval_only     : True
  save_outputs  : False
  bs            : 12


  val_rows : -1 # [26,52] # [int, int], [int,null], -1
  res_dir : outputs/image_propagation
  val_every           : 5


  eval_chunk_size     : 2000
  eval_print_every    : 20

  max_samples         : 500


  val_t_query         : 500
  use_stream          : False
  rollout_mode        : window
  rollout_len         : 10
  rollout_start_idx   : 1


  wandb_vis           : False
  wandb_vis_every     : 50
  wandb_vis_max       : 2
  wandb_vis_frames    : 3

  save_preds_every: 10       # dump preds+GT every N epochs
  save_preds_max_batches: 2  # limit number of videos per epoch
  save_preds_max_frames: 50  # limit frames per video
