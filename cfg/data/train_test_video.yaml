model_config: ../model/dgem_memory.yaml

data:
  task_type       : 'video'
  name            : video_train_test
  num_ch          : 3
  num_class       : 13

  root            : data/videos
  train           : data/sample_dataset/sample_video.csv
  test            : data/sample_dataset/sample_video.csv

  mask_col        : mask


  ignore_index    : 255

  # Grayscale palette -> class id
  code_to_class:
    50: 0    # background
    0:  0    # sometimes background is 0
    11: 1    # abdominal wall
    21: 2    # liver
    13: 3    # GI tract
    12: 4    # fat
    31: 5    # grasper
    23: 6    # connective tissue
    24: 7    # blood
    25: 8    # cystic duct
    32: 9    # L-hook
    22: 10   # gallbladder
    33: 11   # hepatic vein
    5:  12   # liver ligament
    255: 255 # ignore

  label_json      : ''

# EXPERIMENT SETUP

experiment:
  name          : ''
  notes         : 'Set num_class and code_to_class for your labels.'
  seed          : 417
  debug         : False
  SUFFX         : 'video_train_test'

train:
  save_every: 5
  debug         : [False, False]
  use_raw_logits : False
  aux_raw_w     : 0.2
  t_query       : 10           # number of training frames to sample per video
  s_support     : 5           # number of support frames
  allowed_max_items: 100
  allowed_seed: 1337
  allowed_kwin: 2
  allowed_strict_consecutive: True
  jitter        : 0            # jitter around frames 
  epoch_salt    : 0

  use_stream    : True
  rollout_len   : 20        # e.g. 80 frames processed per clip
  rollout_mode  : "full" # window | allowed | full
  loss_on_query_indices_only: True
  resize_h      : 160
  resize_w      : 288
  eval_only     : False
  bs            : 1
  num_workers   : 4
  model_path    : outputs/video_train_test

  epochs        : 200


  cs            : [256, 256] # [256, 256]
  wd            : 0.0001
  lr_enc        : 0.00001
  lr_dec        : 0.0002
  dice_weight   : 0.1
  dice_inc_bg   : False
  amp           : False

  model         : dv3_vitb16    # dv3_vits16plus, _vitb16, _vitl16,
                                      # sam2.1_small, _tiny, _large,
                                      # xmem
  # DV3 SEG
  pt_encoder    : True
  ft_encoder    : True
  unfreeze_epoch   : 0

  # SAM2
  sam2_enhanced: True
  sam2_topk_per_class: 3
  sam2_reprompt_every: 10
  sam2_cc_min_area: 25
  sam2_reprompt_cc_min_area: 50
  sam2_reprompt_prob_thresh: 0.35


val:
  val_t_query         : 10
  val_every           : 10
  use_stream          : False
  rollout_mode        : window
  rollout_len         : 200
  rollout_start_idx   : 1




  wandb_vis           : False
  wandb_vis_every     : 50
  wandb_vis_max       : 2
  wandb_vis_frames    : 3


  save_preds_every: 10       # dump preds+GT every N epochs
  save_preds_max_batches: 2  # limit number of videos per epoch
  save_preds_max_frames: 50  # limit frames per video
