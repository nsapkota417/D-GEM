data:
  task_type       : 'image'
  name            : bile_10min
  num_ch          : 1           # swir: 1, wl: 3, cfg overwrites based on modality
  num_class       : 3
  notes           : 'cisvis_mmv2'
  # root            : /users/nsapkota/VOS/data/datasets/sarrarp50
  train           : /users/nsapkota/VOS/data/datasets/cisvismm/bile_10min.csv
  test            : /users/nsapkota/VOS/data/datasets/cisvismm/bile_10min.csv
  include_indices : [[90,11907]]
  use_rep_only    : True
  modality        : both_on_swir_img      # swir_img, wl_img, both_on_wl_img , both_on_swir_img
  ignore_index    : 255
  code_to_class:
    0:  0    # background
    1:  1    # tool_clasper
    2:  2    # tool_clasper

experiment:
  name          : 'cisvis_mmv2'
  notes         : ''
  seed          : 417
  debug         : False
  SUFFX         : 'bile_10min_both_on_swir_img'
  project_path    : '/users/nsapkota/VOS/results/cisvis_mmv2/bile_10min_both_on_swir_img'



train:
  save_every: 10

  sample_in_video: False
  t_query       : 200          # number of training frames to sample per video

  resize_h      : 
  resize_w      : 

  bs            : 12
  epochs        : 250

  # DV3 SEG
  pt_encoder    : True
  ft_encoder    : True
  unfreeze_epoch   : 3

  use_raw_logits : False
  aux_raw_w     : 0.2
  debug         : [False, False]

  s_support     : 1           # number of support frames
  allowed_max_items: 500
  allowed_seed: 1337
  allowed_kwin: 2
  allowed_strict_consecutive: true
  jitter        : 0            # jitter around frames 
  epoch_salt    : 0

  use_stream    : False
  rollout_len   : 40        # e.g. 80 frames processed per clip
  rollout_mode  : window # window | allowed | full
  loss_on_query_indices_only: True

  num_workers   : 4



  cs            : [256, 256] # [256, 256]
  wd            : 0.0001
  lr_enc        : 0.00001
  lr_dec        : 0.0002
  dice_weight   : 0.1
  dice_inc_bg   : False
  amp           : False

  model         : dv3_vits16plus    # dv3_vits16plus, _vitb16, _vitl16,
                                      # sam2.1_small, _tiny, _large,
                                      # xmem, stm
                                      # raft

  ckpt_to_use : '' # '/users/nsapkota/VOS/results_xma/cisvismm_v100_ftT/cisvismm/dv3_vits16plus/best_05250242.pth'
                # '/users/nsapkota/VOS/results_xma/cisvismm_a10_ftT_540p_bs12/cisvismm/dv3_vits16plus/best_05241757.pth' # '/users/nsapkota/VOS/results/cnh_pe/cnh/dv3_vits16plus/best_04250357.pth' 
                # NE: '/users/nsapkota/VOS/results/nch/cnh/dv3_vits16plus/best_04050440.pth'



  # SAM2
  sam2_enhanced: True
  sam2_topk_per_class: 3
  sam2_reprompt_every: 10
  sam2_cc_min_area: 25
  sam2_reprompt_cc_min_area: 50
  sam2_reprompt_prob_thresh: 0.35

  # ---- memory (ABD v2: reliability + attention)
  K                   : 20        # TM keeps last K / # of C items 
  max_dt              : 64       # temporal PE window
  use_memory          : False    # enable memory
  use_tm              : True    # use transient memory
  use_am              : True    # use anchor memory

  # ---- AM (Anchor Memory) budget + attention bias 
  am_max_items         : 8        # max pinned+unpinned anchors per video
  am_red_lambda        : 0.5      # redundancy penalty for eviction
  am_attn_beta         : 2.0      # log(w) bias strength in AM attention
  am_keep_k            : 256      # top-k FG patches kept per anchor/class (support)
  attn_topk_am         : 256      # AM read top-k (can be > TM)
  attn_topk_tm         : 128      # TM read top-k

  use_mem_attention   : True     # enable attention-based read
  attn_sharp          : 80     # attention softmax temperature

  enable_am_refresh: True  # if you want multi-anchor from multi-support
  skip_tm_t0: True

  am_refresh_sim_max: 0.90
  am_max_per_class: 3

  use_abs_time: True
  max_time_index: 4096

  detach_memory: True      # only if you also pass it into SVSSWrapper

  # ---- fusion (asymmetric trust)
  alpha_am            : 0.15     # anchor memory weight
  alpha_tm            : 0.15     # transient memory weight
  learnable_alpha     : True     # Fusion weights for memory lernable

  # ---- write / read compression
  write_topk_patch_tokens : 128  # store top-128 tokens per TM frame
  read_topk_mem_tokens    : 0    # disable global read pruning

  # ---- TM warmup
  tm_warmup           : 1        # start TM writes at t >= tm_warmup

  # ---- reliability gate (02/12)
  gate_mode           : conf+ent  # off | conf | ent | conf+ent
  gate_conf_thr       : 0.12     # min mean confidence to write TM
  gate_ent_thr        : 0.99     # max mean entropy to write TM


  # ------------------------------------------------------------
  # Pseudo-Anchor gate (AM from predictions) — NEW
  # ------------------------------------------------------------
  allow_pseudo_anchors : True      # OFF by default (safe)

  # cadence
  pseudo_every         : 1           # try pseudo-anchor every N frames
  pseudo_warmup        : 0            # delay before allowing pseudo-anchors

  # probability / quality thresholds
  pseudo_tau           : 0.8         # pixel prob threshold for region mask
  pseudo_q99_thr       : 0.9        # 99th percentile prob threshold
  pseudo_mean_in_thr   : 0.7        # mean prob inside region
  pseudo_min_area      : 0.001        # min region area (fraction of frame)
  pseudo_max_area      : 0.20         # max region area

  # temporal stability
  pseudo_streak_req    : 1            # consecutive passes required

  # storage / influence
  pseudo_k_am          : 128          # #patch tokens per pseudo-anchor
  pseudo_max_per_class : 1            # cap pseudo-anchors per class
  pseudo_conf_scale    : 0.25         # down-weight conf vs GT anchors
  pseudo_w_scale       : 0.50         # down-weight read contribution

  # logits source
  pseudo_use_fused_logits : True      # true: final logits | false: raw logits



val:
  eval_only     : False
  val_rows : -1 # [26,52] # [int, int], [int,null], -1
  res_dir : '/groups/dchen/nick/dgem/dgem_cisvismm_v2'
  bs                  : 5
  val_every           : 5


  eval_chunk_size     : 2000
  eval_print_every    : 20

  max_samples         : 100


  val_t_query         : 10
  use_stream          : False
  rollout_mode        : window
  rollout_len         : 10
  rollout_start_idx   : 1


  wandb_vis           : False
  wandb_vis_every     : 50
  wandb_vis_max       : 2
  wandb_vis_frames    : 3

  save_preds_every: 10       # dump preds+GT every N epochs
  save_preds_max_batches: 2  # limit number of videos per epoch
  save_preds_max_frames: 50  # limit frames per video