# D-GEM asymmetric dual-memory settings. Toggle it globally with
# `python src/train.py ... --use-memory` or `--no-memory`.
train:
  K: 20
  max_dt: 64
  use_memory: true
  use_tm: true
  use_am: true
  am_max_items: 8
  am_red_lambda: 0.5
  am_attn_beta: 2.0
  am_keep_k: 256
  attn_topk_am: 256
  attn_topk_tm: 128
  use_mem_attention: true
  attn_sharp: 80
  enable_am_refresh: true
  skip_tm_t0: true
  am_refresh_sim_max: 0.90
  am_max_per_class: 3
  use_abs_time: true
  max_time_index: 4096
  detach_memory: true
  alpha_am: 0.15
  alpha_tm: 0.15
  learnable_alpha: true
  write_topk_patch_tokens: 128
  read_topk_mem_tokens: 0
  tm_warmup: 1
  gate_mode: conf+ent
  gate_conf_thr: 0.12
  gate_ent_thr: 0.99
  allow_pseudo_anchors: true
  pseudo_every: 1
  pseudo_warmup: 0
  pseudo_tau: 0.8
  pseudo_q99_thr: 0.9
  pseudo_mean_in_thr: 0.7
  pseudo_min_area: 0.001
  pseudo_max_area: 0.20
  pseudo_streak_req: 1
  pseudo_k_am: 128
  pseudo_max_per_class: 1
  pseudo_conf_scale: 0.25
  pseudo_w_scale: 0.50
  pseudo_use_fused_logits: true
